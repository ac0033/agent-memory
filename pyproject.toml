[project]
name = "agent-memory"
version = "0.1.0"
description = "本地长期记忆基础设施：agent 中立，支持 LangGraph 库接入 / MCP / Skill 三种接入方式"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1",
    "fastembed>=0.4",
    "mcp>=1.0",
    "sentence-transformers>=6.0.0",
    "openai>=3.3.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint>=4.2.0",
    "langchain>=1.0",
    "langchain-openai>=1.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
agent-memory = "agent_memory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_memory"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: 需要真实 embedding 模型的慢测试（默认跳过，用 uv run pytest -m slow 运行）",
]
