[project]
name = "agent-memory"
version = "0.4.0"
description = "本地长期记忆基础设施：agent 中立，支持插件 / MCP / Skill / LangGraph 库接入"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1",
    "fastembed>=0.4",
    "mcp>=1.0",
    "sentence-transformers>=6.0.0",
    "openai>=3.3.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint>=4.2.0",
    "langchain>=1.0",
    "langchain-openai>=1.5.2",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
agent-memory = "agent_memory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_memory"]

# Skill 的唯一源头在插件目录，打包时复制进包内，供后台进程的 /SKILL.md 路由读取
[tool.hatch.build.targets.wheel.force-include]
"plugins/agent-memory/skills/agent-memory/SKILL.md" = "agent_memory/SKILL.md"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# 研究草稿（评测集构造脚本与 runner 草稿）里有大量中文长提示词与数据模板，只放宽行长，其余规则照常检查
"docs/research/**" = ["E501"]
# evals/memcompass 是 docs/research/benchmark-suite 的逐字节冻结副本（D6 可信根，不得改写），沿用同样的放宽
"evals/memcompass/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: 需要真实 embedding 模型的慢测试（默认跳过，用 uv run pytest -m slow 运行）",
]
