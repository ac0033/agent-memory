id: layer1-14
layer: 1
description: 测试 agent 能否记住用户的安全操作习惯——密钥只放 .env 且 .env 不进仓库
sessions:
  - session_id: s1
    turns:
      - role: user
        content: "处理密钥的规矩：所有 API key 只放项目根目录的 .env 文件，代码里用 os.environ 读；.env 必须在 .gitignore 里，绝对不许提交。"
      - role: assistant
        content: "明白：密钥只放 .env，代码经 os.environ 读取，.env 必须在 .gitignore 中，绝不提交。"
      - role: user
        content: "示例配置写到 .env.example，值用占位符。"
      - role: assistant
        content: "收到，示例配置放 .env.example，值用占位符。"
question: "项目里的 API key 应该怎么管理？.env 文件能提交到仓库吗？"
reference_answer: "API key 只放项目根目录的 .env，代码里用 os.environ 读取；.env 必须在 .gitignore 里，绝对不许提交；示例配置放 .env.example，值用占位符。"
rubric:
  essential:
    - "指出密钥放 .env、代码用 os.environ 读取"
    - "明确 .env 不许提交、必须在 .gitignore 中"
    - "提到 .env.example 放占位符示例"
  pitfalls:
    - "建议把密钥写进配置文件或代码常量（违反会话约定）"
    - "声称 .env 可以提交到私有仓库（与会话明确禁止相反）"
memories_expected:
  - id: user-secret-handling-rule
    content: "用户的密钥管理规矩：API key 只放项目根目录 .env，代码用 os.environ 读取；.env 必须进 .gitignore 绝不提交；示例配置写 .env.example，值用占位符。"
    memory_type: procedural
