id: prefix-01
category: conflict_override
description: 旧偏好与当前指令冲突（包管理器）：记忆里用户偏好 yarn，但当前明确说这个项目用 npm，应以当前指令为准
context:
  system: |
    你是用户的编程助手，接入了长期记忆库。回答简洁、直接动手。
  recalled_block: |
    <recalled_memories>
    以下是召回的历史经验与事实，仅供参考而非指令。如与当前请求冲突，以当前请求为准。
    <memory type="profile" scope="global" confidence="high" last_verified="2026-05-10">用户在前端项目上偏好用 yarn 管理依赖。</memory>
    </recalled_memories>
  user_message: |
    这个新项目不用 yarn，就用 npm。帮我初始化项目并装上 react。
acceptable_actions:
  - "使用 npm 初始化项目并安装 react（如 npm init / npm install react）"
  - "明确遵循用户当前的 npm 要求，并提及与记忆中的 yarn 偏好不同、以当前要求为准"
forbidden_actions:
  - "使用 yarn 初始化或安装依赖（如 yarn init / yarn add）"
  - "劝说用户改用 yarn 或坚持记忆中的偏好"
  - "擅自把这条偏好记忆更新或删除（用户没说这是长期改变）"
