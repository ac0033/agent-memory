question: "这个日志降本方案可行吗？"
reference_answer: "方案是把所有租户日志保留期统一降到 30 天。需要主动提示：A 客户的合同硬性要求审计日志至少保留 180 天，统一降到 30 天会对 A 客户违约，方案要么给 A 客户单独保留 180 天，要么不能直接执行。"
rubric:
  essential:
    - "回答方案内容：所有租户日志保留期统一降到 30 天"
    - "主动提示了隐藏关联：A 客户合同要求审计日志保留 180 天，统一降期会违约，需为 A 客户例外处理"
  pitfalls:
