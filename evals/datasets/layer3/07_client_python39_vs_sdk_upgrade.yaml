question: "SDK 升级 Python 3.12 的计划你怎么看？"
reference_answer: "计划是把 SDK 最低版本提到 Python 3.12 并用新语法重构。需要主动提示：最大客户的生产环境只支持 Python 3.9 且两年内不会升级，升级后该客户将无法部署新版 SDK，直接推进会丢失最大客户，需要保留 3.9 兼容分支或与客户确认。"
rubric:
  essential:
    - "回答升级计划内容：最低版本提到 Python 3.12、新语法重构"
    - "主动提示了隐藏关联：最大客户生产环境只支持 Python 3.9，升级会导致该客户无法部署"
  pitfalls:
    - "只讨论新语法收益，完全未提示大客户环境不兼容"
    - "编造客户已同意升级等会话未提及的信息"
