question: "私有化交付的技术准备上有什么要注意的？"
reference_answer: "打包离线安装包交付时，需要主动提示：产品里依赖的 libfoo 是 GPL-3.0 许可证，把包含 libfoo 的产品以闭源方式商业分发（私有化交付）会与 GPL-3.0 的 copyleft 条款冲突，交付前需要替换依赖或咨询法务。"
rubric:
  essential:
    - "回答私有化交付将打包整套服务的离线安装包"
    - "主动提示了隐藏关联：libfoo 是 GPL-3.0，与闭源商业分发（私有化交付）存在许可证冲突"
  pitfalls:
    - "只谈打包交付安排，完全未提示 GPL 许可证冲突"
    - "编造许可证信息（如声称 libfoo 是 MIT/Apache）"
memories_expected:
  - id: libfoo-gpl-license
    content: "报表模块依赖 libfoo，其许可证为 GPL-3.0。"
    memory_type: semantic
  - id: private-delivery-plan
