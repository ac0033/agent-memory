question: "日报表任务的部署计划靠谱吗？"
reference_answer: "计划是把日报表任务部署在 db-legacy 的 MySQL 上。需要主动提示：db-legacy 将于 2026-10-15 退役下线、MySQL 实例一并回收，任务上线后很快就会失去数据源，应改部署到长期可用的数据库上，而不是图省事用即将退役的机器。"
rubric:
  essential:
    - "回答部署计划内容：日报表任务部署在 db-legacy 的 MySQL 上"
    - "主动提示了隐藏关联：db-legacy 2026-10-15 退役，任务上线后很快失去数据源，应换库部署"
  pitfalls:
    - "只按省事角度肯定方案，完全未提示服务器退役"
    - "编造退役计划已取消等会话未提及的信息"
memories_expected:
  - id: db-legacy-decommission
    content: "老服务器 db-legacy 将于 2026-10-15 退役下线，其上的 MySQL 实例一并下线。"
    memory_type: semantic
  - id: daily-report-deploy-plan
