id: pr-04
suite: proactive_recall
type: should_surface
description: 之前踩过 PowerShell 单对数组被展开的坑，写同类批量替换脚本时应主动规避
sessions:
  - session_id: s1
    date: 2026-09-13
    turns:
      - role: user
        content: "刚才的替换脚本把每个 c 都换成了 l，怎么回事？"
      - role: assistant
        content: "原因是 @(@('old','new')) 只有一对时会被展开成两个字符串，$pair[0] 和 $pair[1] 变成了单个字符。改用 ,@('old','new') 或 hashtable 就不会有这个问题。"
    memories:
      - id: ps-single-pair-flatten
        content: "PowerShell 坑：@(@('old','new')) 只有一对时会被展开，$pair[0]/$pair[1] 变成单个字符；应使用 ,@('old','new') 或 hashtable。"
        memory_type: procedural
trigger:
  date: 2026-09-20
  user_message: "写个 PowerShell 脚本，把这几个 md 文件里的 foo 替换成 bar（就一对替换）。"
gold:
  should_surface: true
  target_memory_ids: [ps-single-pair-flatten]
  key_details:
    - "单对数组会被展开的坑"
    - "改用 ,@('foo','bar') 或 hashtable，或者直接用 -replace"
  stale_details: []
  max_turn: 1
rubric:
  essential:
    - "给出的脚本不会触发单对数组被展开的问题"
    - "主动提到之前踩过的这个坑，或说明为什么这样写"
  pitfalls:
    - "写出 @(@('foo','bar')) 这种会被展开的写法"
