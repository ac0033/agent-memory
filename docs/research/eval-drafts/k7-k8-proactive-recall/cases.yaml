id: pr-01
suite: proactive_recall
type: should_surface
description: 昨天学的 GloVe 权重函数也用了 3/4 次方，今天问 word2vec 负采样时应主动关联
sessions:
  - session_id: s1
    date: 2026-09-12
    turns:
      - role: user
        content: "GloVe 的加权函数 f(x) 为什么是 (x/x_max)^α，α 为什么取 3/4？"
      - role: assistant
        content: "f(x) 用来压低高频共现对的权重，避免 the、of 这类词主导损失；x 超过 x_max=100 时截断为 1；α=3/4 是论文实验里效果较好的取值。"
    memories:
      - id: glove-weighting-2026-09-12
        content: "2026-09-12 学习了 GloVe：权重函数 f(x)=(x/x_max)^α（α=3/4，x_max=100），用于压低高频共现对的影响。"
        memory_type: episodic
trigger:
  date: 2026-09-13
  user_message: "今天在看 word2vec 的负采样，噪声分布为什么要用 unigram 频率的 3/4 次方？"
gold:
  should_surface: true
  target_memory_ids: [glove-weighting-2026-09-12]
  key_details:
    - "关联到昨天（9/12）学的 GloVe"
    - "GloVe 的权重函数同样用了 α=3/4"
    - "两者都是为了压低高频词的影响"
  stale_details: []
  max_turn: 1
rubric:
  essential:
    - "解释了 3/4 次方的作用（相对原始频率，提高低频词的采样概率、压低高频词）"
    - "主动关联到昨天学的 GloVe 权重函数也用了 3/4，并点出两者的共同动机"
  pitfalls:
    - "编造 GloVe 中并不存在的细节"
